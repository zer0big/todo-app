<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리 앱</title>
  <style>
    :root {
      --bg-page: #eef4ff;
      --bg-page-secondary: #f8fbff;
      --bg-container: rgba(255, 255, 255, 0.86);
      --bg-item: rgba(255, 255, 255, 0.88);
      --bg-item-hover: #ffffff;
      --text-primary: #1f2937;
      --text-heading: #0f172a;
      --text-muted: #64748b;
      --text-done: #94a3b8;
      --border-color: rgba(148, 163, 184, 0.24);
      --shadow: rgba(15, 23, 42, 0.12);
      --shadow-strong: rgba(79, 110, 247, 0.24);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.12);
      --delete-color: #ef4444;
      --delete-bg-hover: rgba(239, 68, 68, 0.12);
      --btn-text: #334155;
      --btn-hover-bg: rgba(148, 163, 184, 0.12);
      --theme-btn-bg: rgba(15, 23, 42, 0.07);
      --theme-btn-hover: rgba(15, 23, 42, 0.12);
    }

    [data-theme="dark"] {
      --bg-page: #020617;
      --bg-page-secondary: #111c33;
      --bg-container: rgba(15, 23, 42, 0.82);
      --bg-item: rgba(30, 41, 59, 0.88);
      --bg-item-hover: rgba(51, 65, 85, 0.96);
      --text-primary: #e2e8f0;
      --text-heading: #f1f5f9;
      --text-muted: #94a3b8;
      --text-done: #64748b;
      --border-color: rgba(148, 163, 184, 0.18);
      --shadow: rgba(15, 23, 42, 0.55);
      --shadow-strong: rgba(99, 102, 241, 0.22);
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --accent-soft: rgba(129, 140, 248, 0.16);
      --delete-color: #f87171;
      --delete-bg-hover: rgba(248, 113, 113, 0.14);
      --btn-text: #cbd5e1;
      --btn-hover-bg: rgba(148, 163, 184, 0.12);
      --theme-btn-bg: rgba(255, 255, 255, 0.08);
      --theme-btn-hover: rgba(255, 255, 255, 0.16);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.22), transparent 34%),
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.18), transparent 28%),
        linear-gradient(160deg, var(--bg-page), var(--bg-page-secondary));
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 72px 20px;
      min-height: 100vh;
      color: var(--text-primary);
      transition: background 0.3s, color 0.3s;
    }

    .container {
      background: var(--bg-container);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      box-shadow: 0 24px 60px var(--shadow);
      backdrop-filter: blur(16px);
      padding: 32px;
      width: 100%;
      max-width: 560px;
      height: fit-content;
      transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
      animation: floatIn 0.55s ease;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .header-copy {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(1.9rem, 3vw, 2.35rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--text-heading);
      transition: color 0.3s;
    }

    .subtitle {
      max-width: 28rem;
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      transition: color 0.3s;
    }

    .theme-toggle {
      background: var(--theme-btn-bg);
      color: var(--text-primary);
      border: none;
      border-radius: 16px;
      width: 46px;
      height: 46px;
      font-size: 1.15rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      background: var(--theme-btn-hover);
      transform: translateY(-1px);
    }

    .input-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin-bottom: 20px;
    }

    .input-area input {
      flex: 1;
      min-height: 56px;
      padding: 16px 18px;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      font-size: 1rem;
      outline: none;
      background: rgba(255, 255, 255, 0.48);
      color: var(--text-primary);
      transition: border-color 0.2s, background 0.3s, color 0.3s, box-shadow 0.2s, transform 0.2s;
    }

    .input-area input::placeholder {
      color: var(--text-muted);
    }

    .input-area input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      transform: translateY(-1px);
    }

    .input-area button {
      min-height: 56px;
      padding: 0 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #ffffff;
      border: none;
      border-radius: 18px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      white-space: nowrap;
      box-shadow: 0 14px 30px var(--shadow-strong);
    }

    .input-area button:hover {
      transform: translateY(-2px);
      filter: brightness(1.02);
    }

    .stats {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
      margin: 0;
      transition: color 0.3s;
    }

    #todo-list {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 20px;
      background: var(--bg-item);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 28px rgba(148, 163, 184, 0.08);
      transition: background 0.15s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: itemIn 0.3s ease both;
    }

    #todo-list li:hover {
      background: var(--bg-item-hover);
      border-color: rgba(99, 102, 241, 0.22);
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(148, 163, 184, 0.12);
    }

    #todo-list li.done {
      background: linear-gradient(135deg, var(--bg-item), var(--accent-soft));
    }

    #todo-list li.done .todo-text {
      text-decoration: line-through;
      color: var(--text-done);
    }

    #todo-list li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text-primary);
      word-break: break-word;
      transition: color 0.3s;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--delete-color);
      font-size: 1.15rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      transition: background 0.15s, transform 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: var(--delete-bg-hover);
      transform: scale(1.05);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .complete-all-btn {
      background: rgba(255, 255, 255, 0.34);
      border: 1px solid var(--border-color);
      color: var(--btn-text);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 11px 15px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.3s, transform 0.2s;
      white-space: nowrap;
    }

    .complete-all-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }

    .empty-state {
      text-align: center;
      color: var(--text-done);
      font-size: 0.96rem;
      padding: 32px 20px;
      border: 1px dashed var(--border-color);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.2);
      transition: color 0.3s;
    }

    #todo-list li.is-removing {
      animation: itemOut 0.22s ease forwards;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes itemIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes itemOut {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      to {
        opacity: 0;
        transform: translateY(-6px) scale(0.96);
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 32px 14px;
      }

      .container {
        padding: 24px 20px;
        border-radius: 24px;
      }

      .header {
        align-items: flex-start;
      }

      .input-area,
      .toolbar {
        grid-template-columns: 1fr;
        flex-direction: column;
        align-items: stretch;
      }

      .theme-toggle,
      .complete-all-btn,
      .input-area button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-copy">
        <span class="eyebrow">Focus Today</span>
        <h1>📝 할 일 관리</h1>
        <p class="subtitle">중요한 일을 정리하고 진행 상황을 한눈에 확인해 보세요.</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="테마 전환">🌙</button>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="todo-input"
        placeholder="할 일을 입력하세요..."
        maxlength="100"
        autocomplete="off"
      />
      <button id="add-btn">추가</button>
    </div>

    <div class="toolbar">
      <p class="stats" id="stats"></p>
      <button class="complete-all-btn" id="complete-all-btn">모두 완료</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="empty-state" id="empty-state">할 일이 없습니다. 새 항목을 추가해 보세요!</p>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const statsEl = document.getElementById('stats');
    const emptyState = document.getElementById('empty-state');
    const themeToggle = document.getElementById('theme-toggle');

    // Theme management
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('theme', next);
    });

    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function updateStats() {
      const total = todos.length;
      const done = todos.filter(t => t.done).length;
      statsEl.textContent = total > 0 ? `전체 ${total}개 · 완료 ${done}개` : '';
      emptyState.style.display = total === 0 ? 'block' : 'none';
    }

    function createListItem(todo) {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.setAttribute('aria-label', '완료 여부');
      checkbox.addEventListener('change', () => {
        todo.done = checkbox.checked;
        li.classList.toggle('done', todo.done);
        saveTodos();
        updateStats();
      });

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = todo.text;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.setAttribute('aria-label', '삭제');
      deleteBtn.addEventListener('click', () => {
        todos = todos.filter(t => t.id !== todo.id);
        li.classList.add('is-removing');
        li.addEventListener('animationend', () => {
          li.remove();
          saveTodos();
          updateStats();
        }, { once: true });
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);
      return li;
    }

    function renderAll() {
      todoList.innerHTML = '';
      todos.forEach(todo => todoList.appendChild(createListItem(todo)));
      updateStats();
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      const todo = { id: Date.now(), text, done: false };
      todos.push(todo);
      todoList.appendChild(createListItem(todo));
      saveTodos();
      updateStats();
      input.value = '';
      input.focus();
    }

    function completeAll() {
      if (todos.length === 0) return;
      todos.forEach(todo => { todo.done = true; });
      saveTodos();
      renderAll();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });
    document.getElementById('complete-all-btn').addEventListener('click', completeAll);

    renderAll();
  </script>
</body>
</html>
