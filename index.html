<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리 앱</title>
  <style>
    :root {
      --bg-page: #f0f2f5;
      --bg-container: #ffffff;
      --bg-item: #f9fafb;
      --bg-item-hover: #f1f3f9;
      --text-primary: #1f2937;
      --text-heading: #1a1a2e;
      --text-muted: #6b7280;
      --text-done: #9ca3af;
      --border-color: #d1d5db;
      --shadow: rgba(0, 0, 0, 0.1);
      --accent: #4f6ef7;
      --accent-hover: #3a57d6;
      --delete-color: #ef4444;
      --delete-bg-hover: #fee2e2;
      --btn-text: #374151;
      --btn-hover-bg: #f3f4f6;
      --theme-btn-bg: #e5e7eb;
      --theme-btn-hover: #d1d5db;
    }

    [data-theme="dark"] {
      --bg-page: #0f172a;
      --bg-container: #1e293b;
      --bg-item: #273549;
      --bg-item-hover: #2f3e55;
      --text-primary: #e2e8f0;
      --text-heading: #f1f5f9;
      --text-muted: #94a3b8;
      --text-done: #64748b;
      --border-color: #334155;
      --shadow: rgba(0, 0, 0, 0.4);
      --accent: #6b8cff;
      --accent-hover: #4f6ef7;
      --delete-color: #f87171;
      --delete-bg-hover: #3b1f1f;
      --btn-text: #cbd5e1;
      --btn-hover-bg: #273549;
      --theme-btn-bg: #334155;
      --theme-btn-hover: #475569;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-page);
      display: flex;
      justify-content: center;
      padding: 60px 16px;
      min-height: 100vh;
      transition: background 0.3s;
    }

    .container {
      background: var(--bg-container);
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--text-heading);
      text-align: center;
      transition: color 0.3s;
    }

    .theme-toggle {
      position: absolute;
      right: 0;
      background: var(--theme-btn-bg);
      border: none;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      line-height: 1;
    }

    .theme-toggle:hover {
      background: var(--theme-btn-hover);
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: var(--bg-container);
      color: var(--text-primary);
      transition: border-color 0.2s, background 0.3s, color 0.3s;
    }

    .input-area input::placeholder {
      color: var(--text-muted);
    }

    .input-area input:focus {
      border-color: var(--accent);
    }

    .input-area button {
      padding: 10px 18px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-area button:hover {
      background: var(--accent-hover);
    }

    .stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      transition: color 0.3s;
    }

    #todo-list {
      list-style: none;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--bg-item);
      margin-bottom: 8px;
      transition: background 0.15s;
    }

    #todo-list li:hover {
      background: var(--bg-item-hover);
    }

    #todo-list li.done .todo-text {
      text-decoration: line-through;
      color: var(--text-done);
    }

    #todo-list li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 0.95rem;
      color: var(--text-primary);
      word-break: break-word;
      transition: color 0.3s;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--delete-color);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: var(--delete-bg-hover);
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .complete-all-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--btn-text);
      font-size: 0.82rem;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.3s;
    }

    .complete-all-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      color: var(--text-done);
      font-size: 0.9rem;
      padding: 24px 0;
      transition: color 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 할 일 관리</h1>
      <button class="theme-toggle" id="theme-toggle" aria-label="테마 전환">🌙</button>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="todo-input"
        placeholder="할 일을 입력하세요..."
        maxlength="100"
        autocomplete="off"
      />
      <button id="add-btn">추가</button>
    </div>

    <div class="toolbar">
      <button class="complete-all-btn" id="complete-all-btn">모두 완료</button>
    </div>
    <p class="stats" id="stats"></p>
    <ul id="todo-list"></ul>
    <p class="empty-state" id="empty-state">할 일이 없습니다. 새 항목을 추가해 보세요!</p>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const statsEl = document.getElementById('stats');
    const emptyState = document.getElementById('empty-state');
    const themeToggle = document.getElementById('theme-toggle');

    // Theme management
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('theme', next);
    });

    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function updateStats() {
      const total = todos.length;
      const done = todos.filter(t => t.done).length;
      statsEl.textContent = total > 0 ? `전체 ${total}개 · 완료 ${done}개` : '';
      emptyState.style.display = total === 0 ? 'block' : 'none';
    }

    function createListItem(todo) {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.setAttribute('aria-label', '완료 여부');
      checkbox.addEventListener('change', () => {
        todo.done = checkbox.checked;
        li.classList.toggle('done', todo.done);
        saveTodos();
        updateStats();
      });

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = todo.text;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.setAttribute('aria-label', '삭제');
      deleteBtn.addEventListener('click', () => {
        todos = todos.filter(t => t.id !== todo.id);
        li.remove();
        saveTodos();
        updateStats();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);
      return li;
    }

    function renderAll() {
      todoList.innerHTML = '';
      todos.forEach(todo => todoList.appendChild(createListItem(todo)));
      updateStats();
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      const todo = { id: Date.now(), text, done: false };
      todos.push(todo);
      todoList.appendChild(createListItem(todo));
      saveTodos();
      updateStats();
      input.value = '';
      input.focus();
    }

    function completeAll() {
      if (todos.length === 0) return;
      todos.forEach(todo => { todo.done = true; });
      saveTodos();
      renderAll();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });
    document.getElementById('complete-all-btn').addEventListener('click', completeAll);

    renderAll();
  </script>
</body>
</html>
